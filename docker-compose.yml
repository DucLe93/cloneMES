services:
  postgres:
    image: postgres:16-alpine
    container_name: clonemes-postgres
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes
    ports:
      - "5432:5432"
    volumes:
      - mes-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d mes"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  mes-postgres-data:
